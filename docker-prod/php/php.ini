; SEEDBOXAPI — PHP overrides (production)
; Loaded after the distro php.ini for both FPM and CLI (conf.d/99-seedboxapi.ini).

[PHP]
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
; Deprecations are noise in production; keep everything else.
error_reporting = E_ALL & ~E_DEPRECATED
html_errors = Off
zend.assertions = -1

memory_limit = 256M
max_execution_time = 60
max_input_time = 60
max_input_vars = 3000
default_socket_timeout = 30

; Uploads are capped at 20 MB by the app (UPLOAD_MAX_KB); allow form overhead.
file_uploads = On
upload_max_filesize = 20M
post_max_size = 25M
max_file_uploads = 10

allow_url_fopen = On
allow_url_include = Off
; proc_open stays enabled: Laravel's scheduler relies on it.
disable_functions = exec,passthru,shell_exec,system,pcntl_exec,dl
enable_dl = Off

realpath_cache_size = 4096K
realpath_cache_ttl = 600

[Session]
; Laravel manages sessions itself; native defaults hardened anyway.
session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
; Served over plain HTTP on your LAN.
session.cookie_secure = 0
session.cookie_samesite = Lax

[opcache]
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 30000
; Code never changes inside a running container.
opcache.validate_timestamps = 0
opcache.save_comments = 1
opcache.jit = off

[Date]
date.timezone = UTC
