; SEEDBOXAPI — PHP-FPM pool (production)
;
; The FPM master runs as root (started by supervisord) and the workers as
; www-data. nginx in the same container talks to it over a Unix socket,
; which is faster than TCP and not reachable from the network.
;
; Sizing: a one-person dashboard plus the scheduler. 4 workers are plenty.

[www]
user = www-data
group = www-data
listen = /tmp/php-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
listen.backlog = 511

pm = dynamic
pm.max_children = 4
pm.start_servers = 1
pm.min_spare_servers = 1
pm.max_spare_servers = 2
; Recycle workers regularly to contain memory leaks.
pm.max_requests = 500

; Liveness endpoint (debugging).
ping.path = /fpm-ping
ping.response = pong

request_terminate_timeout = 75s
request_slowlog_timeout = 10s
slowlog = /proc/self/fd/2

catch_workers_output = yes
decorate_workers_output = no
access.log = /dev/null

; Keep Docker-provided environment variables visible to PHP.
clear_env = no

; Only ever execute .php files.
security.limit_extensions = .php

; No error_log path: workers cannot reopen /proc/self/fd/2 as www-data.
; Unset, PHP errors go to the master via catch_workers_output.
php_admin_flag[log_errors] = on
