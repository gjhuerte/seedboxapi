; SEEDBOXAPI — PHP-FPM pool (production)
;
; FPM runs as www-data (not root), so there are no user/group/listen.owner
; directives. nginx in the same container talks to it over a Unix socket,
; which is faster than TCP and not reachable from the network.
;
; Sizing: ~40 MB per worker. 16 workers ≈ 640 MB, leaving room for nginx,
; the queue worker and the scheduler inside the 1 GB container limit.
; Raise pm.max_children together with the memory limit in docker-compose.yml.

[www]
listen = /tmp/php-fpm.sock
listen.mode = 0600
listen.backlog = 511

pm = dynamic
pm.max_children = 16
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
; Recycle workers regularly to contain memory leaks.
pm.max_requests = 500

; Liveness endpoint (used by `docker exec seedboxapi supervisorctl` debugging).
ping.path = /fpm-ping
ping.response = pong

request_terminate_timeout = 75s
request_slowlog_timeout = 10s
slowlog = /proc/self/fd/2

catch_workers_output = yes
decorate_workers_output = no
access.log = /dev/null

; Keep Docker-provided environment variables visible to PHP.
clear_env = no

; Only ever execute .php files.
security.limit_extensions = .php

php_admin_flag[log_errors] = on
php_admin_value[error_log] = /proc/self/fd/2
