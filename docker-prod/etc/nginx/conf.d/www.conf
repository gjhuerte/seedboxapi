# SEEDBOXAPI — site configuration (production)
#
# Sits behind your reverse proxy (TLS termination) on the `proxy` network.

# Restore the real client IP from the reverse proxy (private ranges only).
# Narrow these to your proxy network's subnet if you can.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Tell PHP the original request was HTTPS when the proxy says so.
map $http_x_forwarded_proto $fastcgi_https {
    default "";
    https   on;
}

# Edge rate limits, per client IP (the app adds per-user limits on top).
# Sized for an office where many employees share one public IP. They only
# work if your reverse proxy sends X-Forwarded-For; otherwise every request
# appears to come from the proxy.
#
# Auth *submissions* only (GET requests have an empty key
# and are not counted by this zone).
map $request_method $seedboxapi_auth_key {
    default "";
    POST    $binary_remote_addr;
}
limit_req_zone  $seedboxapi_auth_key      zone=seedboxapi_auth:10m    rate=30r/m;
limit_req_zone  $binary_remote_addr zone=seedboxapi_general:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=seedboxapi_conn:10m;

upstream php_fpm {
    server unix:/tmp/php-fpm.sock;
    keepalive 16;
}

server {
    listen 8080 default_server;
    server_name _;

    root  /var/www/html/public;
    index index.php;

    limit_conn seedboxapi_conn 100;
    limit_req_status  429;
    limit_conn_status 429;

    # Container health check that does not touch PHP.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Never serve hidden files (.env, .git …) or backup/config files.
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    location ~* \.(bak|old|orig|swp|sql|sqlite|log|sh|ini|dist|lock|env)$ {
        deny all;
        return 404;
    }

    # Fingerprinted Vite assets are cached for a year.
    location /build/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Public uploads: static only, never executed, sandboxed.
    location /storage/ {
        location ~ \.php$ { return 404; }
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Stricter limit on sign-in, registration, password reset and token
    # endpoints (web or /api prefixed).
    location ~ ^/(api/)?(login|register|forgot-password|reset-password|mfa/|auth/|tokens) {
        limit_req zone=seedboxapi_auth burst=20 nodelay;
        limit_req zone=seedboxapi_general burst=120 nodelay;
        try_files $uri /index.php?$query_string;
    }

    # Static files get baseline security headers here; PHP responses get the
    # full set (including the CSP) from Laravel, so nginx does not repeat them.
    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # Application requests (static assets under /build/ are not limited).
        limit_req zone=seedboxapi_general burst=120 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Only the front controller is executable.
    location = /index.php {
        fastcgi_pass php_fpm;
        fastcgi_keep_conn on;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param DOCUMENT_ROOT   $document_root;
        fastcgi_param HTTPS           $fastcgi_https if_not_empty;
        fastcgi_param HTTP_PROXY      "";
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 75s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location ~ \.php$ {
        return 404;
    }
}
