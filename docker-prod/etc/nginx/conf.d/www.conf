# SEEDBOXAPI — site configuration (production)
#
# Served from inside gluetun's network namespace and published through the
# gluetun container. The entrypoint rewrites the listen port from PORT.

upstream php_fpm {
    server unix:/tmp/php-fpm.sock;
    keepalive 8;
}

server {
    listen 8095 default_server;
    server_name _;

    root  /var/www/html/public;
    index index.php;

    # Container health check that does not touch PHP.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Never serve hidden files (.env, .git …) or backup/config files.
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    location ~* \.(bak|old|orig|swp|sql|sqlite|log|sh|ini|dist|lock|env)$ {
        deny all;
        return 404;
    }

    # Fingerprinted Vite assets are cached for a year.
    location /build/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Only the front controller is executable.
    location = /index.php {
        fastcgi_pass php_fpm;
        fastcgi_keep_conn on;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param DOCUMENT_ROOT   $document_root;
        fastcgi_param HTTP_PROXY      "";
        fastcgi_hide_header X-Powered-By;
        # An update waits up to MAM_TIMEOUT for MyAnonamouse.
        fastcgi_read_timeout 75s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location ~ \.php$ {
        return 404;
    }
}
