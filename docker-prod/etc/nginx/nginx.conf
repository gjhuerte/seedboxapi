# SEEDBOXAPI — nginx main configuration (production)
#
# The master runs as root (started by supervisord) to open the log pipes;
# workers run as www-data. pid and temp paths live in /tmp.

user www-data;
worker_processes 1;
worker_rlimit_nofile 8192;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 512;
    multi_accept on;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset      utf-8;

    # Logging: JSON-ish single line, real client IP (see real_ip in www.conf).
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time urt=$upstream_response_time';
    access_log /dev/stdout main buffer=16k flush=5s;

    # Writable temp paths for an unprivileged, read-only container.
    client_body_temp_path /tmp/nginx_client_body;
    proxy_temp_path       /tmp/nginx_proxy;
    fastcgi_temp_path     /tmp/nginx_fastcgi;
    uwsgi_temp_path       /tmp/nginx_uwsgi;
    scgi_temp_path        /tmp/nginx_scgi;

    # Performance
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  30s;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    server_names_hash_bucket_size 64;
    open_file_cache          max=10000 inactive=60s;
    open_file_cache_valid    120s;
    open_file_cache_min_uses 2;
    open_file_cache_errors   on;

    # Security
    server_tokens off;
    client_max_body_size   25m;
    client_body_buffer_size 128k;
    client_body_timeout    30s;
    client_header_timeout  15s;
    send_timeout           30s;
    large_client_header_buffers 4 16k;

    # Compression
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml font/woff2;

    include /etc/nginx/conf.d/*.conf;
}
