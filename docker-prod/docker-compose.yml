# SEEDBOXAPI — production stack
#
#   cp docker-prod/.env.example docker-prod/.env     # VPN credentials, ports
#   docker compose -f docker-prod/docker-compose.yml up -d --build
#
# seedboxapi shares gluetun's network namespace (network_mode:
# "service:gluetun"), so every request to MyAnonamouse leaves through the VPN
# and MAM registers the VPN's IP. That also means:
#   - the web UI port is published on the *gluetun* service, not here;
#   - PORT must not clash with anything else in gluetun's network
#     (qBittorrent often uses 8080, gluetun itself 8000 and 8888).
#
# Already running gluetun? Copy only the `seedboxapi` service into that
# compose file and add its port to gluetun's `ports:`.

name: seedboxapi

services:
  gluetun:
    image: qmcgaw/gluetun:${GLUETUN_TAG:-v3}
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      VPN_SERVICE_PROVIDER: ${VPN_SERVICE_PROVIDER:?set VPN_SERVICE_PROVIDER in docker-prod/.env}
      VPN_TYPE: ${VPN_TYPE:-wireguard}
      WIREGUARD_PRIVATE_KEY: ${WIREGUARD_PRIVATE_KEY:-}
      WIREGUARD_ADDRESSES: ${WIREGUARD_ADDRESSES:-}
      OPENVPN_USER: ${OPENVPN_USER:-}
      OPENVPN_PASSWORD: ${OPENVPN_PASSWORD:-}
      SERVER_COUNTRIES: ${SERVER_COUNTRIES:-}
      TZ: ${TZ:-UTC}
    ports:
      # seedboxapi web UI (served from inside this network namespace).
      - "${SEEDBOXAPI_BIND:-127.0.0.1}:${SEEDBOXAPI_HTTP_PORT:-8095}:${PORT:-8095}"
    restart: unless-stopped

  seedboxapi:
    image: ${SEEDBOXAPI_IMAGE:-seedboxapi}:${SEEDBOXAPI_TAG:-latest}
    build:
      context: ..
      dockerfile: docker-prod/Dockerfile
    container_name: seedboxapi
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    volumes:
      - ./seedboxapi-volume/config:/config
      - ./seedboxapi-volume/tmp:/tmp
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - DEBUG=${DEBUG:-0}
      - mam_id=${MAM_ID:-}
      - INTERVAL=${INTERVAL:-600}
      - PORT=${PORT:-8095}
      # Optional HTTP Basic auth for the web UI.
      - UI_USERNAME=${UI_USERNAME:-}
      - UI_PASSWORD=${UI_PASSWORD:-}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # The entrypoint needs these to apply PUID/PGID and fix volume ownership;
    # everything else is dropped.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
