; SEEDBOXAPI — supervisord (production)
;
; supervisord runs as root so it can open the container's stdout/stderr;
; children only ever write to the pipes it hands them. nginx and PHP-FPM
; masters drop their workers to www-data themselves; the scheduler runs as
; www-data. `docker logs seedboxapi` shows everything.

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

; Local control socket for `docker exec seedboxapi supervisorctl status`.
[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:php-fpm]
command=php-fpm --nodaemonize --force-stderr
priority=10
autostart=true
autorestart=true
startretries=3
stopsignal=QUIT
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
priority=20
autostart=true
autorestart=true
startretries=3
stopsignal=QUIT
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Ticks every minute; `mam:sync --if-due` contacts MAM every INTERVAL seconds.
[program:scheduler]
command=php /var/www/html/artisan schedule:work
user=www-data
directory=/var/www/html
environment=HOME="/tmp"
priority=30
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
