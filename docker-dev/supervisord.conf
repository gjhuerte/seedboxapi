; SEEDBOXAPI — supervisord (development)
;
; php-fpm and nginx, plus the scheduler (runs mam:sync when due while
; MAM_AUTO_SYNC=true) and the Vite dev server. Output goes to
; `docker logs`. Control them with:
;   docker exec -it seedboxapi supervisorctl status|restart scheduler|stop vite

[supervisord]
nodaemon=true
user=www-data
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:php-fpm]
command=php-fpm --nodaemonize --force-stderr
priority=10
autorestart=true
stopsignal=QUIT
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
priority=20
autorestart=true
stopsignal=QUIT
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:scheduler]
command=php /var/www/html/artisan schedule:work
priority=40
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Vite dev server with hot reload (VITE_DEV_SERVER=false to skip it).
; Needs `npm install` once; until then it retries a few times and gives up.
[program:vite]
command=npm run dev
directory=/var/www/html
environment=VITE_DOCKER="true",HOME="/home/www-data"
autostart=%(ENV_VITE_DEV_SERVER)s
priority=50
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
