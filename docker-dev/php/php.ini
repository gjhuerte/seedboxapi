; SEEDBOXAPI — PHP overrides (development)
; Loaded after the distro php.ini for both FPM and CLI (conf.d/99-seedboxapi.ini).

[PHP]
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On
error_log = /proc/self/fd/2
html_errors = On
zend.assertions = 1

memory_limit = 512M
max_execution_time = 120
max_input_time = 120

; Same upload limits as production (the app caps files at 20 MB).
upload_max_filesize = 20M
post_max_size = 25M

[opcache]
opcache.enable = 1
opcache.enable_cli = 0
; Pick up code changes on every request.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

[xdebug]
; Off unless XDEBUG_MODE is set (debug, develop, coverage, profile, trace).
xdebug.mode = ${XDEBUG_MODE}
xdebug.start_with_request = trigger
xdebug.client_host = host.docker.internal
xdebug.client_port = 9003
xdebug.discover_client_host = false
xdebug.idekey = SEEDBOXAPI
xdebug.output_dir = /var/www/html/storage/logs/xdebug
xdebug.log_level = 0

[pcov]
; Fast code coverage, off by default. Use: php -d pcov.enabled=1 artisan test --coverage
pcov.enabled = 0
pcov.directory = /var/www/html/app

[Date]
date.timezone = UTC
