# SEEDBOXAPI — development stack
#
#   cp docker-dev/.env.example docker-dev/.env     # set UID/GID, ports
#   docker compose -f docker-dev/docker-compose.yml up -d --build
#   docker exec -it seedboxapi composer setup      # deps, .env, key, DB, assets
#
# The project folder is bind-mounted and runs as your user. Unlike prod it is
# NOT inside gluetun, so MAM would see your home IP: automatic updates are off
# by default (MAM_AUTO_SYNC=false). "Update now" in the UI still works — use a
# throwaway MAM session for testing.

name: seedboxapi

services:
  app:
    container_name: seedboxapi
    image: seedboxapi:dev
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    working_dir: /var/www/html
    restart: unless-stopped
    environment:
      XDEBUG_MODE: ${XDEBUG_MODE:-off}
      MAM_AUTO_SYNC: ${MAM_AUTO_SYNC:-false}
      INTERVAL: ${INTERVAL:-600}
      DEBUG: ${DEBUG:-0}
      VITE_DEV_SERVER: ${VITE_DEV_SERVER:-true}
      VITE_HMR_HOST: ${VITE_HMR_HOST:-localhost}
      VITE_POLLING: ${VITE_POLLING:-false}
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8009}:8080"
      - "${APP_BIND:-127.0.0.1}:${VITE_PORT:-5173}:5173"
    volumes:
      - ${PROJECT_PATH:-..}:/var/www/html
      - /etc/localtime:/etc/localtime:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
