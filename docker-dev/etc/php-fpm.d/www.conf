; SEEDBOXAPI — PHP-FPM pool (development)
; Runs as www-data (your host UID). Unix socket shared with nginx.

[www]
listen = /tmp/php-fpm.sock
listen.mode = 0600

; Few workers are plenty for one developer and keep memory low.
pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 0

; Debugging endpoints (exposed by nginx at /fpm-status and /fpm-ping).
pm.status_path = /fpm-status
ping.path = /fpm-ping

; Log any request slower than 5s with a PHP stack trace.
request_slowlog_timeout = 5s
slowlog = /proc/self/fd/2

catch_workers_output = yes
decorate_workers_output = no
clear_env = no
security.limit_extensions = .php
