# SEEDBOXAPI — site configuration (development)

server {
    listen 8080 default_server;
    server_name _;

    root  /var/www/html/public;
    index index.php;

    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM status page for debugging worker usage: http://localhost:8009/fpm-status
    location ~ ^/(fpm-status|fpm-ping)$ {
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 10.0.0.0/8;
        deny all;
        include fastcgi_params;
        fastcgi_param SCRIPT_NAME $uri;
        fastcgi_param SCRIPT_FILENAME $uri;
        fastcgi_pass unix:/tmp/php-fpm.sock;
    }

    location = /index.php {
        fastcgi_pass unix:/tmp/php-fpm.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param DOCUMENT_ROOT   $realpath_root;
        fastcgi_param HTTP_PROXY      "";
        # Long timeout so Xdebug breakpoints do not time out.
        fastcgi_read_timeout 600s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location ~ \.php$ {
        return 404;
    }
}
