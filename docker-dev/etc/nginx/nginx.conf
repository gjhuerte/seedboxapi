# SEEDBOXAPI — nginx main configuration (development)
#
# Unprivileged (www-data, port 8080): pid and temp paths in /tmp, logs to
# stdout/stderr so `docker logs seedboxapi` shows them.

worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/stderr info;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset      utf-8;

    log_format main '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                    'rt=$request_time urt=$upstream_response_time';
    access_log /dev/stdout main;

    client_body_temp_path /tmp/nginx_client_body;
    proxy_temp_path       /tmp/nginx_proxy;
    fastcgi_temp_path     /tmp/nginx_fastcgi;
    uwsgi_temp_path       /tmp/nginx_uwsgi;
    scgi_temp_path        /tmp/nginx_scgi;

    sendfile          off;   # bind mounts: always serve the file as it is now
    tcp_nodelay       on;
    keepalive_timeout 65;
    server_tokens     off;
    client_max_body_size 25m;

    include /etc/nginx/conf.d/*.conf;
}
